<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a field manual — sticky tab rail, one section at a time, boards drawn as live maps. Single dark look by choice (used beside the game). */
:root{
  --bg:#10131c; --panel:#171b28; --panel2:#1d2232; --line:#2b3246; --fg:#ebe6d8; --muted:#9ba1b5;
  --gold:#e3b862; --wind:#73cdbd; --warn:#ef8c6a;
  --n-common:#8b91a6; --n-rare:#5fc28d; --n-legend:#5f9ff2; --n-unique:#f0974c;
  --f-display:"Marcellus", "Palatino Linotype", Georgia, serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
a{color:var(--gold)}
a:focus-visible,button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--wind);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.hero{padding-block:36px 20px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--wind)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(34px,6vw,54px);line-height:1.05}
h1 em{font-style:normal;color:var(--gold)}
h2{font-size:clamp(26px,4vw,34px);margin-bottom:6px}
h3{font-size:21px;margin-bottom:8px;color:var(--gold)}
.lede{color:var(--muted);max-width:68ch;margin:0}
p{max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:14px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px}
nav.tabs button{flex:0 0 auto;background:none;border:1px solid transparent;color:var(--muted);font:600 14px var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{color:var(--bg);background:var(--gold)}
section.tab{padding-top:28px;display:grid;gap:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.callout{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--panel));padding:14px 16px;border-radius:0 10px 10px 0}
.callout.ok{border-color:var(--wind);background:color-mix(in srgb,var(--wind) 8%,var(--panel))}
.callout b{color:var(--fg)}
ol.steps,ul.plain{margin:0;padding-left:22px;display:grid;gap:6px}
.kbd{font-family:var(--f-mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;padding:1px 6px;border-radius:5px;white-space:nowrap}
.tag{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.tag.wind{color:var(--wind);border-color:color-mix(in srgb,var(--wind) 50%,transparent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kr{color:var(--muted);font-size:13px}

/* level plan */
.bracket{display:grid;grid-template-columns:110px 1fr;gap:18px;padding-block:18px;border-top:1px solid var(--line)}
.bracket:first-of-type{border-top:0}
.bracket .lv{font-family:var(--f-display);font-size:30px;color:var(--gold);line-height:1}
.bracket .lv small{display:block;font:600 11px var(--f-mono);letter-spacing:.1em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.checks{display:grid;gap:8px;min-width:0}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;cursor:pointer}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--wind)}
.check .what{min-width:0}
.check .sys{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.sys.skill{color:var(--n-legend)} .sys.spec{color:var(--wind)} .sys.stig{color:var(--gold)} .sys.dae{color:var(--n-unique)} .sys.gear{color:var(--n-rare)} .sys.tip{color:var(--muted)}
.check:has(input:checked){opacity:.55}
.check:has(input:checked) .what{text-decoration:line-through;text-decoration-color:var(--muted)}
.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar{flex:1 1 200px;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--wind);width:0;transition:width .3s}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}

/* boards */
.boardtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--panel);color:var(--muted);border:0;padding:8px 12px;font:600 14px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--gold)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.boardlayout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.svgwrap{overflow-x:auto;background:radial-gradient(circle at 50% 50%,#1b2236 0%,var(--panel) 70%);border:1px solid var(--line);border-radius:14px;padding:8px}
.svgwrap svg{display:block;width:100%;min-width:440px;height:auto}
.slider{display:grid;gap:6px}
.slider input{width:100%;accent-color:var(--gold)}
.readout{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.info{min-height:48px;font-size:14.5px}
.miles{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:520px;overflow:auto}
.miles li{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:7px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:14px;cursor:pointer}
.miles li.done{opacity:.5}
.miles li.next{border-color:var(--gold)}
.miles .st{font-family:var(--f-mono);color:var(--muted);font-size:12.5px}
.miles .pt{font-family:var(--f-mono);color:var(--gold);font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;display:inline-block;border-radius:3px}
.sw.c{background:var(--n-common)} .sw.r{background:var(--n-rare);border-radius:50%} .sw.l{background:var(--n-legend);border-radius:50%} .sw.u{background:var(--n-unique)}
@keyframes ringpulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.stepring{animation:ringpulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.stepring{animation:none}}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
.nextring{animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.nextring{animation:none}.bar i{transition:none}}

/* rotation tiles */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tile{display:inline-grid;place-items:center;min-width:92px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);text-align:center;line-height:1.2}
.tile b{font-size:14px;font-weight:600}
.tile small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.tile.buff{border-color:color-mix(in srgb,var(--gold) 60%,transparent)} .tile.buff b{color:var(--gold)}
.tile.debuff{border-color:color-mix(in srgb,var(--wind) 60%,transparent)} .tile.debuff b{color:var(--wind)}
.tile.nuke{border-color:color-mix(in srgb,var(--n-legend) 70%,transparent)} .tile.nuke b{color:#9cc4ff}
.tile.manual{border-style:dashed}
.arrow{color:var(--muted);font-family:var(--f-mono)}
.macroline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.macroline .key{font-family:var(--f-display);font-size:22px;color:var(--gold);width:44px;height:44px;border:1px solid var(--gold);border-radius:10px;display:grid;place-items:center}
.mock{font-family:var(--f-mono);font-size:13px;background:#0c0f17;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);overflow-x:auto;white-space:pre}
.mock b{color:var(--fg);font-weight:600}
/* icons */
.ico{width:28px;height:28px;border-radius:6px;vertical-align:middle;border:1px solid #000;box-shadow:0 0 0 1px var(--line);flex:0 0 auto}
.ico.lg{width:40px;height:40px;border-radius:8px}
.ico.sm{width:22px;height:22px;border-radius:5px}
.inl{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;font-weight:600}
.tile .ico{margin-bottom:5px}
/* rank grid */
.rankgrid td,.rankgrid th{padding:6px 8px}
.rankgrid td.sk{white-space:nowrap}
.rankgrid td.rk{text-align:center;font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rankgrid td.rk.up{color:var(--fg);background:color-mix(in srgb,var(--wind) 14%,transparent)}
.rankgrid td.rk.spec{color:var(--gold)}
.rankgrid td.rk.max{color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.rankgrid tr.grp td{background:var(--panel2);font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rankgrid th.pts{color:var(--wind)}
/* phase guide */
.phasepick{display:flex;flex-wrap:wrap;gap:6px}
.phasepick button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer}
.phasepick button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
.phase{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.phase li{display:grid;grid-template-columns:24px 92px 32px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line)}
.phase li input{width:18px;height:18px;accent-color:var(--wind);margin:0}
.phase li:has(input:checked){opacity:.5}
.chip{font:600 11.5px var(--f-mono);letter-spacing:.04em;padding:3px 8px;border-radius:6px;text-align:center;color:#0d1018}
.chip.Nezekan{background:#b9c4e6}.chip.Zikel{background:#9fd7c8}.chip.Vaizel{background:#e3b862}.chip.Triniel{background:#e79aa6}.chip.Azphel{background:#c7a6ef}
.phase .go{font:600 12.5px var(--f-mono);color:var(--gold);background:none;border:1px solid var(--line);border-radius:7px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.pctico{width:32px;height:32px;border-radius:6px;background:var(--n-unique);display:grid;place-items:center;color:#0d1018;font:700 11px var(--f-mono)}
/* game-like macro window */
.mwin{background:linear-gradient(#1a1f2e,#141824);border:1px solid #39415a;border-radius:12px;overflow:hidden;min-width:0}
.mwin .mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:#202639;border-bottom:1px solid #39415a;flex-wrap:wrap}
.mwin .mhead b{font-family:var(--f-display);font-size:18px;font-weight:400;color:var(--gold)}
.mwin .mbody{padding:12px;display:grid;gap:8px}
.mstep{display:grid;grid-template-columns:56px 1fr 120px;gap:12px;align-items:center;padding:10px;border:1px solid #333b52;border-radius:9px;background:#11141d}
.mstep .no{font:600 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stack{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack .sl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);width:76px;text-align:center;line-height:1.2}
.stack .sl .ico{width:44px;height:44px}
.stack .ord{font:700 10px var(--f-mono);color:var(--wind)}
.delay{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.delay span.v{background:#0a0c12;border:1px solid #39415a;border-radius:6px;padding:5px 10px;color:var(--fg);min-width:52px;text-align:right}
.addrow{border:1px dashed #39415a;border-radius:9px;padding:10px;text-align:center;color:var(--muted);font-size:13.5px}
.keychip{font:600 12px var(--f-mono);border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:3px 8px}
@media (max-width:620px){.mstep{grid-template-columns:1fr}.phase li{grid-template-columns:24px 80px 32px 1fr;}.phase li .go{grid-column:2/-1;justify-self:start}}
.wingtable tr.wgrp td{background:var(--panel2);font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wingtable tr.best-pve td{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.wingtable tr.best-pvp td{background:color-mix(in srgb,var(--wind) 10%,transparent)}
.wingtable td.num{white-space:nowrap;color:var(--gold)}
.qbar{display:grid;grid-template-columns:repeat(13,minmax(66px,1fr));gap:6px;min-width:900px}
.qcol{display:grid;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;align-content:start}
.qcol.man{border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.qk{font:700 12px var(--f-mono);color:var(--gold);text-align:center}
.qrow{display:grid;grid-template-columns:10px 1fr;gap:3px;align-items:center}
.qrow i{font:600 9px var(--f-mono);color:var(--muted);font-style:normal}
.qc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;line-height:1.15;text-align:center;color:var(--fg);min-height:64px}
.qc .ico{width:40px;height:40px}
.qc.empty{border:1px dashed var(--line);border-radius:6px;min-height:46px}
.qnote{font:600 9.5px var(--f-mono);color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.geartable td{vertical-align:middle}
.gstones{display:flex;flex-wrap:wrap;gap:6px}
.gchk{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);font-size:13px;cursor:pointer;white-space:nowrap}
.gchk input{width:16px;height:16px;margin:0;accent-color:var(--wind)}
.gchk:has(input:checked){border-color:color-mix(in srgb,var(--wind) 60%,transparent);color:var(--wind)}
.phase li.phasehead{display:block;background:var(--panel2);border-style:dashed}
.farmgrid{display:grid;gap:8px}
.farmcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.farmcard[open]{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.farmcard summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}
.farmcard summary::-webkit-details-marker{display:none}
.farmcard .fname{display:grid;gap:2px;min-width:0}
.farmcard .feasy{font-size:13.5px;color:var(--muted)}
.farmcard .ffav{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin:10px 0;color:var(--wind)}
.farmdot{width:40px;height:40px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:700 13px var(--f-mono);color:var(--gold);flex:0 0 auto}
.farmdot::before{content:attr(data-l)}
.mannotes{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.fcount{margin-left:auto;font:600 12px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;flex:0 0 auto}
.fcount[data-full="1"]{color:var(--wind);border-color:color-mix(in srgb,var(--wind) 60%,transparent)}
.dwtab td.num,.dwtab th.num{min-width:92px}
.dwtab .dwbox{width:20px;height:20px;accent-color:var(--wind)}
.dwtab tr:has(.dwbox:checked) td:first-child,.dwtab tr:has([data-dwc^="srv|"]:checked) td:first-child{opacity:.6}
.dwdel{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;cursor:pointer;font-size:11px;padding:1px 6px;margin-top:4px}
.dwdel:hover{color:var(--warn);border-color:var(--warn)}
.xchk{display:inline-flex;align-items:center;gap:5px;margin-right:8px;padding:2px 7px;border:1px solid var(--line);border-radius:999px;font:600 11px var(--f-mono);letter-spacing:.03em;color:var(--muted);background:var(--panel2);cursor:pointer;vertical-align:middle;white-space:nowrap}
.xchk input{width:15px;height:15px;margin:0;accent-color:var(--wind)}
.xchk:has(input:checked){color:var(--wind);border-color:color-mix(in srgb,var(--wind) 60%,transparent)}
tr.xrow:has(.xchk input:checked) td,li.xrow:has(.xchk input:checked){opacity:.62}
.guidebox{display:grid;gap:10px;border-color:color-mix(in srgb,var(--gold) 50%,transparent);position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);z-index:3;background:var(--panel)}
.guidehead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.guidecur{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.guidebtns{display:flex;flex-wrap:wrap;gap:8px}
.phase li.gcur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.progrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.progcard{display:grid;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);font:inherit;cursor:pointer}
.progcard:hover{border-color:var(--gold)}
.progcard .ptitle{font-weight:600}
.pgcur{display:grid;gap:4px}
.pgcur .what{font-size:15.5px}
.check.gcur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.equipcard{background:var(--panel2);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.equipcard b{font-size:16px}
tr.tcur td{background:color-mix(in srgb,var(--wind) 10%,transparent)}
